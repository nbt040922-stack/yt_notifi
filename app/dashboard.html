<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YT_NOTIFI</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0b0d12; color: #edf1f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #172033, #0b0d12 48%); }
    main { width: min(920px, calc(100% - 32px)); margin: 48px auto; }
    header, .row, .actions, .summary { display: flex; align-items: center; }
    header { justify-content: space-between; margin-bottom: 28px; }
    h1 { margin: 0; font-size: 25px; letter-spacing: .08em; }
    h2 { margin: 38px 0 14px; font-size: 13px; letter-spacing: .14em; color: #9da8b8; }
    .running, .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #42d392; box-shadow: 0 0 12px #42d39299; }
    .summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; overflow: hidden; border: 1px solid #293142; border-radius: 12px; background: #293142; }
    .metric { padding: 18px; background: #111620; }
    .metric span { display: block; color: #8f9bad; font-size: 12px; margin-bottom: 7px; }
    .metric strong { font-size: 17px; }
    .metric small { display: block; color: #8f9bad; margin-top: 7px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; }
    button { border: 1px solid #344057; border-radius: 8px; background: #171e2b; color: #edf1f7; padding: 9px 13px; cursor: pointer; }
    button:hover { border-color: #647697; }
    button.primary { background: #3b6df6; border-color: #3b6df6; }
    button.danger { color: #ff9ca6; }
    .channel { border: 1px solid #293142; border-radius: 12px; padding: 20px; margin-bottom: 12px; background: #111620dd; }
    .row { justify-content: space-between; gap: 18px; }
    .channel h3 { margin: 0 0 5px; font-size: 17px; }
    .title-row { display: flex; align-items: center; gap: 7px; }
    .title-row h3 { margin: 0; }
    .edit-name { padding: 2px 6px; border: 0; background: transparent; font-size: 16px; }
    .channel-id { color: #8f9bad; font-family: ui-monospace, monospace; font-size: 13px; overflow-wrap: anywhere; }
    .badge { margin-top: 11px; color: #aeb8c7; }
    .badge .dot { width: 7px; height: 7px; }
    .badge.disabled .dot { background: #697386; box-shadow: none; }
    .badge.retrying .dot { background: #f0b849; box-shadow: 0 0 10px #f0b84966; }
    .details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #252d3c; }
    .details span { display: block; color: #7f8a9b; font-size: 11px; margin-bottom: 5px; }
    .details strong { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
    .actions { gap: 8px; flex-shrink: 0; }
    .actions select { width: auto; min-width: 110px; }
    .profile-map { min-width: 230px; }
    .profile-map label { margin: 0 0 6px; }
    .profile-map small { display: block; margin-top: 6px; color: #8f9bad; }
    .empty, .error { padding: 28px; text-align: center; color: #8f9bad; border: 1px dashed #344057; border-radius: 12px; }
    .error { color: #ff9ca6; }
    dialog { width: min(480px, calc(100% - 28px)); border: 1px solid #344057; border-radius: 14px; background: #111620; color: #edf1f7; padding: 24px; }
    dialog::backdrop { background: #000a; }
    dialog h3 { margin-top: 0; }
    label { display: block; color: #aeb8c7; font-size: 13px; margin: 16px 0 6px; }
    input, textarea, select { width: 100%; border: 1px solid #344057; border-radius: 8px; background: #0b0f17; color: #fff; padding: 11px; }
    textarea { min-height: 170px; resize: vertical; }
    .tabs { display: flex; gap: 8px; margin: 28px 0 8px; }
    .tabs button.active { background: #3b6df6; border-color: #3b6df6; }
    .tab-pane[hidden] { display: none; }
    .bulk { border: 1px solid #293142; border-radius: 12px; padding: 20px; background: #111620dd; }
    .bulk-result { margin-top: 14px; color: #aeb8c7; white-space: pre-wrap; }
    input[readonly] { color: #9eabbd; background: #121824; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .resolve-status { min-height: 18px; margin-top: 7px; color: #9eabbd; font-size: 12px; }
    .resolve-status.success { color: #42d392; }
    .job { display: grid; grid-template-columns: 1fr 1.2fr .7fr .8fr .8fr 1fr 1.4fr .6fr auto; gap: 12px; padding: 14px; border-bottom: 1px solid #252d3c; align-items: center; }
    .job:first-child { border-top: 1px solid #252d3c; }
    .job span { overflow-wrap: anywhere; font-size: 13px; }
    .job .muted { color: #8f9bad; }
    .job .failed, .job .cancelled { color: #ff9ca6; }
    .tiktok-publish { display: grid; gap: 4px; min-width: 0; }
    .tiktok-publish-title { color: #fff; font-weight: 700; }
    .tiktok-publish-line { color: #c7d0df; font-size: 12px; overflow-wrap: anywhere; }
    .tiktok-publish-error { color: #ff7f8c; font-size: 12px; overflow-wrap: anywhere; }
    .tiktok-progress { height: 7px; width: 100%; background: #252d3c; border-radius: 99px; overflow: hidden; }
    .tiktok-progress > i { display: block; height: 100%; background: #3b6df6; border-radius: inherit; transition: width .25s ease; }
    .job-actions { display: flex; gap: 6px; }
    .form-error { min-height: 20px; margin: 12px 0; color: #ff9ca6; font-size: 13px; }
    .notice { position: fixed; right: 20px; bottom: 20px; background: #183a2d; border: 1px solid #34775d; border-radius: 9px; padding: 11px 15px; display: none; }
    @media (max-width: 700px) { main { margin-top: 24px; } .summary, .details { grid-template-columns: repeat(2, 1fr); } .row { align-items: flex-start; flex-direction: column; } .job { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header><h1>YT_NOTIFI</h1><div class="running"><span class="dot"></span><span id="watcher">ĐANG CHẠY</span></div></header>
  <section class="summary">
    <div class="metric"><span>Polling</span><strong id="interval">—</strong></div>
    <div class="metric"><span>yt-dlp</span><strong id="ytdlp">—</strong></div>
    <div class="metric"><span>Telegram</span><strong id="telegram">—</strong></div>
    <div class="metric"><span>Kênh đang bật</span><strong id="enabled">—</strong></div>
  </section>
  <div class="form-error" id="migration-warning"></div>
  <section class="tab-pane" id="silence-tab">
    <h2>THÊM HÀNG LOẠT KÊNH</h2>
    <form class="bulk" id="channel-bulk-form">
      <label for="channel-bulk-input">Mỗi dòng một URL kênh YouTube</label>
      <textarea id="channel-bulk-input" required placeholder="https://www.youtube.com/@channel1&#10;https://www.youtube.com/channel/UC..."></textarea>
      <div class="form-error" id="channel-bulk-error"></div>
      <button class="primary" id="channel-bulk-submit" type="submit">Thêm kênh</button>
      <div class="bulk-result" id="channel-bulk-result"></div>
    </form>
    <h2>KÊNH THEO DÕI</h2>
    <div id="channels"></div>
    <div class="toolbar"><h2>JOBS</h2><button class="danger" id="clear-completed">Xóa toàn bộ lịch sử</button></div>
    <div id="jobs"></div>
  </section>
</main>
<dialog id="rename-dialog">
  <form id="rename-form">
    <h3>Đổi tên hiển thị</h3>
    <label for="rename-input">Tên kênh</label>
    <input id="rename-input" maxlength="100" required>
    <div class="form-error" id="rename-error"></div>
    <div class="actions"><button type="button" id="rename-cancel">Hủy</button><button class="primary" type="submit">Lưu</button></div>
  </form>
</dialog>
<div class="notice" id="notice"></div>

<script>
  const list = document.querySelector('#channels');
  const jobsList = document.querySelector('#jobs');
  let renameChannel = null;
  let minhaProfiles = [];
  let minhaAvailable = false;
  const formatTime = value => value ? new Date(value).toLocaleTimeString('vi-VN') : '—';
  const escapeText = value => String(value ?? '—');

  async function request(url, options) {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || 'Yêu cầu thất bại.');
    return data;
  }

  function detail(label, value) {
    const box = document.createElement('div');
    const caption = document.createElement('span');
    const content = document.createElement('strong');
    caption.textContent = label;
    content.textContent = escapeText(value);
    box.append(caption, content);
    return box;
  }

  function minhaProfileSelector(channel) {
    const box = document.createElement('div'); box.className = 'profile-map';
    const label = document.createElement('label'); label.textContent = 'TikTok Profile';
    const select = document.createElement('select');
    const unassigned = document.createElement('option'); unassigned.value = ''; unassigned.textContent = 'Chưa gán MinHa profile';
    select.append(unassigned);
    for (const profile of minhaProfiles) {
      const option = document.createElement('option'); option.value = profile.id;
      const username = profile.tiktok_username ? ` · @${profile.tiktok_username}` : '';
      option.textContent = `${profile.name}${username} · ${profile.tiktok_account_match || 'UNKNOWN'}`;
      select.append(option);
    }
    if (channel.minha_profile_id && !minhaProfiles.some(profile => profile.id === channel.minha_profile_id)) {
      const missing = document.createElement('option'); missing.value = channel.minha_profile_id;
      missing.textContent = minhaAvailable ? 'MinHa profile không còn tồn tại' : `Đã gán · ${channel.minha_profile_id}`;
      select.append(missing);
    }
    select.value = channel.minha_profile_id || '';
    select.disabled = !minhaAvailable;
    select.onchange = async () => {
      try {
        await request(`/api/channels/${channel.channel_id}/minha-profile`, {
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({minha_profile_id:select.value || null}),
        });
        showNotice('Đã lưu MinHa profile.'); await refresh();
      } catch (failure) { showNotice(failure.message); await refresh(); }
    };
    const state = document.createElement('small');
    state.textContent = minhaAvailable ? 'Dữ liệu trực tiếp từ MinHa' : 'MinHa đang không khả dụng; mapping được giữ nguyên';
    box.append(label, select, state); return box;
  }

  function channelCard(channel) {
    const card = document.createElement('article');
    card.className = 'channel';
    const row = document.createElement('div'); row.className = 'row';
    const info = document.createElement('div');
    const title = document.createElement('h3'); title.textContent = channel.name;
    const titleRow = document.createElement('div'); titleRow.className = 'title-row';
    const edit = document.createElement('button'); edit.className = 'edit-name'; edit.type = 'button'; edit.textContent = '✎'; edit.title = 'Đổi tên kênh'; edit.setAttribute('aria-label', `Đổi tên ${channel.name}`);
    edit.onclick = () => { renameChannel = channel; document.querySelector('#rename-input').value = channel.name; document.querySelector('#rename-error').textContent = ''; document.querySelector('#rename-dialog').showModal(); };
    titleRow.append(title, edit);
    const id = document.createElement('div'); id.className = 'channel-id'; id.textContent = channel.channel_id;
    const badge = document.createElement('div');
    badge.className = `badge ${channel.enabled ? (channel.failures ? 'retrying' : '') : 'disabled'}`;
    const dot = document.createElement('span'); dot.className = 'dot';
    const status = document.createElement('span'); status.textContent = channel.status;
    const cutStatus = document.createElement('div'); cutStatus.className = 'badge';
    cutStatus.textContent = `Cắt tool: ${channel.cut_enabled ? 'ON' : 'OFF'}`;
    badge.append(dot, status); info.append(titleRow, id, badge, cutStatus);
    const actions = document.createElement('div'); actions.className = 'actions';
    const cut = document.createElement('button'); cut.textContent = `Cắt tool: ${channel.cut_enabled ? 'ON' : 'OFF'}`;
    cut.onclick = async () => { await request(`/api/channels/${channel.channel_id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cut_enabled:!channel.cut_enabled})}); await refresh(); };
    const toggle = document.createElement('button'); toggle.textContent = channel.enabled ? 'Tắt' : 'Bật';
    toggle.onclick = async () => { await request(`/api/channels/${channel.channel_id}`, {method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({enabled: !channel.enabled})}); await refresh(); };
    const remove = document.createElement('button'); remove.className = 'danger'; remove.textContent = 'Xóa';
    remove.onclick = async () => { if (confirm('Xóa kênh khỏi danh sách theo dõi? Lịch sử phát hiện vẫn được giữ.')) { await request(`/api/channels/${channel.channel_id}`, {method: 'DELETE'}); showNotice('Đã xóa kênh.'); await refresh(); } };
    actions.append(minhaProfileSelector(channel), cut, toggle, remove); row.append(info, actions);
    const details = document.createElement('div'); details.className = 'details';
    details.append(detail('Poll gần nhất', formatTime(channel.last_poll_at)), detail('Thành công gần nhất', formatTime(channel.last_success_at)), detail('Video gần nhất', channel.latest_seen_video_id), detail('Số lỗi', channel.failures));
    card.append(row, details); return card;
  }

  function renderTikTokPublish(tikTok) {
    const box = document.createElement('div'); box.className = 'tiktok-publish';
    if (!tikTok) { box.textContent = 'TikTok: Chưa có job đăng'; return box; }
    const labels = {
      CONNECT_CDP:'Kết nối MinHa', PAGE_FOUND:'Đã tìm thấy trang TikTok', UPLOAD_PAGE_OPEN:'Đã mở TikTok Studio',
      WAIT_FILE_INPUT:'Đang chờ ô chọn video', FILE_INPUT_FOUND:'Đã tìm thấy ô upload', SET_INPUT_FILES_START:'Đang chọn video',
      SET_INPUT_FILES_DONE:'Đã chọn video', UPLOAD_STARTED:'Bắt đầu upload', UPLOAD_PROGRESS:'Đang upload', UPLOAD_COMPLETE:'Upload hoàn tất', UPLOAD_COMPLETE_REAL:'Upload hoàn tất', TIKTOK_UPLOAD_COMPLETE:'Upload hoàn tất',
      CONFIGURING_POST:'Đang cấu hình bài đăng', POSTING:'Đang đăng', VERIFYING:'Đang xác minh', DONE:'ĐÃ ĐĂNG', BLOCKED:'BỊ CHẶN', FAILED:'LỖI',
      POST_RESULT_UNCERTAIN:'KHÔNG XÁC ĐỊNH KẾT QUẢ', QUEUED:'Đang chờ', VALIDATING:'Đang kiểm tra', IDENTITY_CHECK:'Đang xác minh tài khoản',
      OPENING_BROWSER:'Đang mở trình duyệt', WAITING_TIKTOK_UPLOAD:'Đang chờ TikTok upload', READY_TO_POST:'Sẵn sàng đăng', READY_FOR_POST:'Sẵn sàng đăng', UPLOADING:'Đang upload'
    };
    const step = tikTok.current_step || tikTok.status || '—';
    const percent = Math.max(0, Math.min(100, Number(tikTok.progress_percent) || 0));
    const title = document.createElement('strong'); title.className = 'tiktok-publish-title'; title.textContent = 'TikTok Publish';
    const status = document.createElement('span'); status.className = 'tiktok-publish-line'; status.textContent = `Trạng thái: ${tikTok.status || '—'}`;
    const current = document.createElement('span'); current.className = 'tiktok-publish-line'; current.textContent = `Bước: ${labels[step] || step}`;
    const progress = document.createElement('span'); progress.className = 'tiktok-publish-line'; progress.textContent = `Tiến độ: ${Math.round(percent)}%`;
    const bar = document.createElement('div'); bar.className = 'tiktok-progress'; bar.setAttribute('aria-label', `Tiến độ ${Math.round(percent)}%`);
    const fill = document.createElement('i'); fill.style.width = `${percent}%`; bar.append(fill);
    const updated = document.createElement('span'); updated.className = 'tiktok-publish-line'; updated.textContent = `Cập nhật: ${tikTok.updated_at || '—'}`;
    const attempt = document.createElement('span'); attempt.className = 'tiktok-publish-line'; attempt.textContent = `Attempt: ${tikTok.attempt_count || 0}/1`;
    const browser = document.createElement('span'); browser.className = 'tiktok-publish-line'; browser.textContent = `Browser: ${['VALIDATING','IDENTITY_CHECK','OPENING_BROWSER','UPLOADING','CONFIGURING_POST','POSTING','VERIFYING','READY_TO_POST'].includes(tikTok.status) ? 'RUNNING' : 'STOPPED'}`;
    const cdp = document.createElement('span'); cdp.className = 'tiktok-publish-line'; cdp.textContent = `CDP: ${['SESSION_LOST_BEFORE_POST','CDP_DISCONNECTED'].includes(tikTok.current_step) || (tikTok.failure_reason || '').includes('CDP_DISCONNECTED') ? 'DISCONNECTED' : (tikTok.status === 'READY_TO_POST' ? 'CONNECTED' : '—')}`;
    const waiting = document.createElement('span'); waiting.className = 'tiktok-publish-line'; waiting.textContent = `Waiting for confirmation: ${tikTok.status === 'READY_TO_POST' ? 'YES' : 'NO'}`;
    const pid = document.createElement('span'); pid.className = 'tiktok-publish-line'; pid.textContent = 'Browser PID: —';
    const lastEvent = document.createElement('span'); lastEvent.className = 'tiktok-publish-line'; lastEvent.textContent = `Last event: ${step}`;
    box.append(title, status, attempt, browser, cdp, waiting, pid, current, progress, bar, updated, lastEvent);
    if (tikTok.status === 'DONE') {
      const profile = minhaProfiles.find(item => item.id === tikTok.minha_profile_id);
      const posted = document.createElement('span'); posted.className = 'tiktok-publish-line';
      posted.textContent = `✅ ĐÃ ĐĂNG · @${tikTok.tiktok_username || '—'} · ${profile?.name || tikTok.minha_profile_id || '—'} · ${tikTok.receipt_posted_at || tikTok.updated_at || '—'}${tikTok.receipt_post_url || tikTok.receipt_post_id ? ` · ${tikTok.receipt_post_url || tikTok.receipt_post_id}` : ''}`;
      box.append(posted);
      const verification = document.createElement('span'); verification.className = 'tiktok-publish-line';
      verification.textContent = `Xác minh: ${tikTok.verification_method || '—'} · Post ID/URL: ${tikTok.receipt_post_id || tikTok.receipt_post_url || '—'}`;
      box.append(verification);
    } else if (tikTok.status === 'POST_RESULT_UNCERTAIN') {
      const uncertain = document.createElement('span'); uncertain.className = 'tiktok-publish-error';
      uncertain.textContent = '⚠ POST RESULT UNCERTAIN — KHÔNG TỰ ĐỘNG THỬ LẠI'; box.append(uncertain);
    } else if (tikTok.failure_reason) {
      const error = document.createElement('span'); error.className = 'tiktok-publish-error'; error.textContent = `Lỗi: ${tikTok.failure_reason}`; box.append(error);
    }
    return box;
  }

  function jobCard(job) {
    const row = document.createElement('div'); row.className = 'job';
    const channel = document.createElement('strong'); channel.textContent = job.channel_name;
    const video = document.createElement('span'); video.textContent = job.video_title || job.video_id;
    const jobError = job.status === 'CANCELLED' ? 'USER_REQUEST' : job.process_error || job.download_error || job.error;
    const status = document.createElement('span'); status.textContent = jobError ? `${job.status}: ${jobError}` : job.status;
    if (job.status === 'FAILED') status.className = 'failed';
    if (job.status === 'CANCELLED') status.className = 'cancelled';
    const download = document.createElement('span'); download.className = 'muted';
    download.textContent = job.download_state ? `${job.download_state}${job.download_progress ? ` ${Math.round(job.download_progress)}%` : ''}` : '—';
    const processing = document.createElement('span'); processing.className = 'muted';
    processing.textContent = job.process_state ? `${job.process_state}${job.process_progress ? ` ${Math.round(job.process_progress)}%` : ''}` : '—';
    const nasLabels = {NOT_REQUIRED:'DIRECT', PENDING:job.process_state === 'DONE' ? 'PENDING SYNC' : 'LOCAL FALLBACK', SYNCING:'SYNCING', FAILED_RETRY:'RETRYING', DONE:'SYNCED', CONFLICT:'CONFLICT'};
    const nas = document.createElement('div'); nas.className = job.nas_sync_state === 'CONFLICT' ? 'failed' : 'muted';
    nas.textContent = `NAS: ${nasLabels[job.nas_sync_state] || '—'}`;
    if (job.status === 'COMPLETED' && ['PENDING','FAILED_RETRY'].includes(job.nas_sync_state)) {
      const retry = document.createElement('button'); retry.textContent = 'Retry NAS Sync';
      retry.onclick = async () => { await request(`/api/jobs/${job.id}/retry-nas-sync`, {method:'POST'}); await refresh(); };
      nas.append(document.createElement('br'), retry);
    }
    const publish = renderTikTokPublish(job.tiktok_publish);
    if (false) {
    const publishLabels = {
      CONNECT_CDP:'CONNECTING', PAGE_FOUND:'CONNECTING', UPLOAD_PAGE_OPEN:'OPENING UPLOAD',
      WAIT_FILE_INPUT:'SELECTING VIDEO', FILE_INPUT_FOUND:'SELECTING VIDEO',
      SET_INPUT_FILES_START:'SELECTING VIDEO', SET_INPUT_FILES_DONE:'SELECTING VIDEO',
      UPLOAD_STARTED:'UPLOADING', UPLOAD_PROGRESS:'UPLOADING', UPLOAD_COMPLETE:'CONFIGURING',
      QUEUED:'WAITING', VALIDATING:'WAITING', IDENTITY_CHECK:'WAITING', OPENING_BROWSER:'WAITING',
      READY_FOR_POST:'WAITING', UPLOADING:'UPLOADING', CONFIGURING_POST:'UPLOADING',
      POSTING:'POSTING', VERIFYING:'POSTING', DONE:'POSTED', BLOCKED:'BLOCKED', FAILED:'FAILED',
      POST_RESULT_UNCERTAIN:'POST_RESULT_UNCERTAIN'
    };
    const tikTok = job.tiktok_publish;
    const liveStep = tikTok?.current_step || tikTok?.status;
    const liveLabel = publishLabels[liveStep] || liveStep;
    publish.textContent = `TikTok: ${tikTok ? (liveLabel || '—') : '—'}`;
    if (tikTok?.progress_percent) publish.textContent += ` ${Math.round(tikTok.progress_percent)}%`;
    if (tikTok?.status === 'DONE') {
      const postRef = tikTok.receipt_post_url || tikTok.receipt_post_id;
      const profile = minhaProfiles.find(item => item.id === tikTok.minha_profile_id);
      publish.textContent += ` · @${tikTok.tiktok_username} · ${profile?.name || tikTok.minha_profile_id} · ${formatTime(tikTok.receipt_posted_at)}${postRef ? ` · ${postRef}` : ''}`;
    } else if (tikTok?.failure_reason) publish.textContent += ` · ${tikTok.failure_reason}`;
    }
    const output = document.createElement('span'); output.className = 'muted'; output.textContent = job.processing_output_dir || job.output_dir || '—';
    const created = document.createElement('span'); created.className = 'muted'; created.textContent = formatTime(job.created_at);
    const actions = document.createElement('div'); actions.className = 'job-actions';
    if (['QUEUED','DOWNLOAD_PENDING','DOWNLOADING','DOWNLOADED','PROCESS_PENDING','PROCESSING'].includes(job.status)) {
      const cancel = document.createElement('button'); cancel.className = 'danger'; cancel.textContent = 'Hủy';
      cancel.onclick = async () => {
        if (!confirm('Hủy job này?')) return;
        try { await request(`/api/jobs/${job.id}/cancel`, {method:'POST'}); await refresh(); }
        catch (failure) { showNotice(failure.message); }
      };
      actions.append(cancel);
    }
    if (['FAILED','CANCELLED'].includes(job.status)) {
      const retry = document.createElement('button'); retry.textContent = 'Thử lại';
      retry.onclick = async () => {
        try { await request(`/api/jobs/${job.id}/retry`, {method:'POST'}); await refresh(); }
        catch (failure) { showNotice(failure.message); }
      };
      actions.append(retry);
      const clear = document.createElement('button'); clear.className = 'danger'; clear.textContent = 'Xóa';
      clear.onclick = async () => {
        if (!confirm('Xóa lịch sử job này? File đã tạo sẽ được giữ nguyên.')) return;
        try {
          await request(`/api/jobs/${job.id}`, {method:'DELETE'});
          showNotice('Đã xóa lịch sử job.');
          await refresh();
        } catch (failure) { showNotice(failure.message); }
      };
      actions.append(clear);
    }
    row.append(channel, video, status, download, processing, nas, publish, output, created, actions); return row;
  }

  async function refresh() {
    try {
      const [status, channels, jobs, profiles] = await Promise.all([
        request('/api/status'), request('/api/channels'),
        request('/api/jobs'),
        request('/api/minha/profiles').catch(() => null),
      ]);
      minhaAvailable = profiles !== null;
      minhaProfiles = profiles || [];
      document.querySelector('#interval').textContent = `${status.poll_interval_seconds}s`;
      document.querySelector('#ytdlp').textContent = status.ytdlp;
      document.querySelector('#telegram').textContent = status.telegram;
      document.querySelector('#enabled').textContent = status.enabled_channels;
      document.querySelector('#migration-warning').textContent = '';
      const ownedChannels = channels;
      const ownedJobs = jobs;
      list.replaceChildren(...(ownedChannels.length ? ownedChannels.map(channelCard) : [Object.assign(document.createElement('div'), {className:'empty', textContent:'Chưa có kênh nào.'})]));
      jobsList.replaceChildren(...(ownedJobs.length ? ownedJobs.map(jobCard) : [Object.assign(document.createElement('div'), {className:'empty', textContent:'Chưa có job nào.'})]));
    } catch (error) {
      list.replaceChildren(Object.assign(document.createElement('div'), {className:'error', textContent:error.message}));
    }
  }

  function showNotice(message) { const notice = document.querySelector('#notice'); notice.textContent = message; notice.style.display = 'block'; setTimeout(() => notice.style.display = 'none', 2200); }
  document.querySelector('#clear-completed').onclick = async () => {
    if (!confirm('Xóa lịch sử các job đã hoàn thành?')) return;
    try {
      const result = await request('/api/jobs/clear-completed', {method:'POST'});
      showNotice(`Đã xóa ${result.cleared} job hoàn thành.`);
      await refresh();
    } catch (failure) { showNotice(failure.message); }
  };
  document.querySelector('#clear-completed').onclick = async () => {
    if (!confirm('Xóa toàn bộ lịch sử job?')) return;
    try {
      const result = await request('/api/jobs/clear-completed', {method:'POST'});
      showNotice(`Đã xóa ${result.cleared} job lịch sử.`);
      await refresh();
    } catch (failure) { showNotice(failure.message); }
  };
  const clearFailed = document.querySelector('#clear-failed'); if (clearFailed) clearFailed.onclick = async () => {
    if (!confirm('Xóa các job lỗi hoặc bị chặn? Job đang chạy và kết quả chưa xác định sẽ được giữ lại.')) return;
    try {
      const result = await request('/api/jobs/clear-failed', {method:'POST'});
      showNotice(`Đã xóa ${result.cleared} job lỗi.`);
      await refresh();
    } catch (failure) { showNotice(failure.message); }
  };
  document.querySelector('#rename-cancel').onclick = () => document.querySelector('#rename-dialog').close();
  document.querySelector('#rename-form').onsubmit = async event => {
    event.preventDefault();
    const error = document.querySelector('#rename-error'); error.textContent = '';
    try {
      await request(`/api/channels/${renameChannel.channel_id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:document.querySelector('#rename-input').value})});
      document.querySelector('#rename-dialog').close();
      await refresh();
    } catch (failure) { error.textContent = failure.message; }
  };
  document.querySelector('#channel-bulk-form').onsubmit = async event => {
    event.preventDefault();
    const input = document.querySelector('#channel-bulk-input');
    const submit = document.querySelector('#channel-bulk-submit');
    const error = document.querySelector('#channel-bulk-error');
    const output = document.querySelector('#channel-bulk-result');
    const channels = input.value.split(/\r?\n/).map(value => value.trim()).filter(Boolean);
    if (!channels.length) { error.textContent = 'Hãy nhập ít nhất một URL kênh.'; return; }
    error.textContent = ''; output.textContent = ''; submit.disabled = true;
    submit.textContent = `Đang nhận diện 0 / ${channels.length}...`;
    try {
      const result = {total:0, added:0, existing:0, failed:0, results:[]};
      for (let offset = 0; offset < channels.length; offset += 20) {
        const batch = await request('/api/channels/bulk', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({channels:channels.slice(offset, offset + 20)})});
        for (const key of ['total', 'added', 'existing', 'failed']) result[key] += batch[key];
        result.results.push(...batch.results);
        submit.textContent = `Đang nhận diện ${Math.min(offset + 20, channels.length)} / ${channels.length}...`;
      }
      output.textContent = `Đã xử lý: ${result.total}\nĐã thêm: ${result.added}\nĐã tồn tại: ${result.existing}\nThất bại: ${result.failed}\n\n` + result.results.map(item => `${item.input} → ${item.status}${item.error ? `: ${item.error}` : ''}`).join('\n');
      if (result.failed === 0) input.value = '';
      await refresh();
    } catch (failure) { error.textContent = failure.message; }
    finally { submit.disabled = false; submit.textContent = 'Thêm kênh'; }
  };
  refresh(); setInterval(refresh, 10000);
</script>
</body>
</html>
